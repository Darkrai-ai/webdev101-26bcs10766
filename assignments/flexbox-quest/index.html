<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="game-header">
        <h1>Flexbox Quest</h1>

        <div class="game-info">
            <span>Lives: 3</span>
            <span>Coins: 120</span>
            <span>Level: 1</span>
            <span>Score: 1250</span>
        </div>

        <div class="header-actions">
            <button>Pause</button>
            <button>Menu</button>
        </div>
    </header>

    <main>
        <section class="game-area">
            <div class="game-message">Collect all the stars!</div>

            <div class="game-row sky">
                <div class="player">Player</div>
                <div class="star">Star</div>
            </div>

            <div class="game-row mid">
                <div class="platform">Platform</div>
            </div>

            <div class="game-row ground">
                <div class="platform">Platform</div>
                <div class="platform">Platform</div>
            </div>
        </section>

        <section class="game-panels">
            <div class="panel controls">
                <h2>Controls</h2>
                <div class="control-row">
                    <button>↑</button>
                </div>
                <div class="control-row">
                    <button>←</button>
                    <button>↓</button>
                    <button>→</button>
                </div>
                <button class="btn-jump">Jump</button>
            </div>

            <div class="panel inventory">
                <h2>Inventory</h2>
                <div class="inventory-items">
                    <div class="item">Sword</div>
                    <div class="item">Shield</div>
                    <div class="item">Potion</div>
                    <div class="item">Key</div>
                    <div class="item">Bow</div>
                    <div class="item">Magic Potion</div>
                    <div class="item">Map</div>
                    <div class="item">Coin</div>
                </div>
            </div>

            <div class="panel quest">
                <h2>Quest</h2>
                <div class="quest-item">
                    <span>Collect 3 Stars</span>
                    <span>1 / 3</span>
                </div>
                <div class="quest-item">
                    <span>Find the Golden Key</span>
                    <span>0 / 1</span>
                </div>
                <div class="quest-item">
                    <span>Defeat the Monster</span>
                    <span>0 / 1</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Flexbox Quest - 26BCS10766</p>
    </footer>

</body>
</html>
