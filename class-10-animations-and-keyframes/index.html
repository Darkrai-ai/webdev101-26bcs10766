<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animations</title>
    <style>
        button {
            background-color: blue;
            height: 40px;
            width: 150px;
            position: absolute;
            top: 200px;
            left: 500px;
            transition: background-color 2s cubic-bezier(1, 0.25, 0, 0.9);
        }

        button:hover {
            background-color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button>hover me</button>
</body>
</html>
